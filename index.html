<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Centro de Operaciones</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--surface:#fff;--ink:#14213d;--mut:#6b7893;--line:#e1e6ef;--side:#ffffff;--side2:#eef2f8;--stx:#44546f;--stx2:#8391a8;--stl:#e2e8f1;--sts:#14213d;--acc:#10b5a4;--acc2:#0b8f82;--warn:#f59e0b;--bad:#ef4444;--ok:#22c55e;--r:14px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0b1224;--surface:#131d38;--ink:#e8edf8;--mut:#8f9bb8;--line:#233156;--side:#0a1226;--side2:#16223f;--stx:#cbd5ea;--stx2:#8d9ac0;--stl:#26345c;--sts:#ffffff}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* Sidebar */
.side{width:268px;background:var(--side);color:var(--stx);border-right:1px solid var(--stl);display:flex;flex-direction:column;padding:20px 14px;flex-shrink:0;transition:transform .35s cubic-bezier(.3,.8,.3,1),background-color .35s,color .35s;z-index:30}
.brand{display:flex;align-items:center;gap:12px;padding:4px 10px 22px;color:var(--sts);font-weight:800;font-size:17px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--acc),#3b82f6);display:grid;place-items:center;box-shadow:0 6px 18px rgba(16,181,164,.4)}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;background:none;border-radius:12px;text-align:left;font-weight:600;font-size:14.5px;color:var(--stx);position:relative;transition:background .2s,color .2s}
.item:hover{background:var(--side2);color:var(--sts)}
.item.active{background:linear-gradient(90deg,rgba(16,181,164,.25),rgba(16,181,164,.05));color:var(--sts)}
.item.active::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--acc)}
.item svg{width:20px;height:20px;flex-shrink:0}
.chev{margin-left:auto;transition:transform .3s}
.open>.item .chev{transform:rotate(90deg)}
.sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.3,.8,.3,1)}
.open>.sub{grid-template-rows:1fr}
.sub>div{overflow:hidden;margin-left:22px;border-left:1px solid var(--stl);padding-left:8px}
.sub .item{padding:9px 12px;font-size:13.5px;font-weight:500}
.sub .item .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex-shrink:0}
.badge{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.user{display:flex;align-items:center;gap:10px;padding:12px;border-top:1px solid var(--stl);margin-top:10px;color:var(--sts);font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:#3b82f6;color:#fff;display:grid;place-items:center;font-weight:700}
.user small{display:block;color:var(--stx2)}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:18px 28px;border-bottom:1px solid var(--line);background:var(--surface)}
.burger{display:none;border:1px solid var(--line);background:none;border-radius:10px;padding:8px}
.top h1{font-size:20px;margin:0;font-weight:800}
.top p{margin:2px 0 0;color:var(--mut);font-size:13px}
.sp{flex:1}
.btn{border:0;background:var(--acc);color:#fff;font-weight:700;padding:10px 18px;border-radius:11px;font-size:14px;transition:transform .15s,background .2s,box-shadow .2s;box-shadow:0 6px 16px rgba(16,181,164,.3)}
.btn:hover{background:var(--acc2);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--bg)}
.view{flex:1;overflow:auto;padding:26px 28px 40px}
.view>*{animation:in .45s cubic-bezier(.3,.8,.3,1) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;background:var(--c);opacity:.12}
.kpi span{color:var(--mut);font-size:13px;font-weight:600}
.kpi b{display:block;font-size:34px;font-weight:800;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{margin:0;font-size:16px;font-weight:700;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--mut);transition:.2s}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{text-align:left;font-size:12.5px;color:var(--mut);font-weight:600;padding:12px 20px;background:var(--bg)}
td{padding:14px 20px;border-top:1px solid var(--line)}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:var(--bg)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.empty{padding:40px;text-align:center;color:var(--mut)}

.set{display:flex;align-items:center;gap:16px;padding:18px 20px;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.set div{flex:1}.set small{color:var(--mut);display:block;margin-top:2px}
.sw{width:46px;height:26px;border-radius:99px;background:var(--line);border:0;position:relative;transition:background .25s;padding:0;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,.8,.3,1);box-shadow:0 2px 4px rgba(0,0,0,.25)}
.sw[aria-checked=true]{background:var(--acc)}
.sw[aria-checked=true]::after{transform:translateX(20px)}
details{border-top:1px solid var(--line);padding:16px 20px}
details:first-of-type{border-top:0}
summary{font-weight:700;cursor:pointer}
details p{color:var(--mut);margin:10px 0 0;line-height:1.55}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(8,14,30,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.ov.show{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border-radius:20px;width:100%;max-width:480px;padding:26px;transform:translateY(24px) scale(.96);transition:transform .35s cubic-bezier(.3,1.3,.5,1);box-shadow:0 30px 80px rgba(0,0,0,.35);max-height:90vh;overflow:auto}
.ov.show .modal{transform:none}
.modal h3{margin:0 0 4px;font-size:20px}
.modal .sub2{color:var(--mut);margin:0 0 18px;font-size:13.5px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
textarea{resize:vertical;min-height:80px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
.dl{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;font-size:14px;margin:0}
.modal.wide{max-width:960px}
.tg{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:start}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.sec{margin:20px 0 -4px;padding-top:14px;border-top:1px dashed var(--line);font-size:13px;font-weight:800;color:var(--acc2)}
.sec:first-of-type{border-top:0;margin-top:6px;padding-top:0}
pre.tpl{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;font:12.5px/1.65 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;margin:0;position:sticky;top:0}
@media (max-width:760px){.tg{grid-template-columns:1fr}.fg3{grid-template-columns:1fr}}
.dl dt{color:var(--mut)}.dl dd{margin:0;font-weight:600}
.toast{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:14px 20px;border-radius:12px;font-weight:600;transform:translateY(100px);opacity:0;transition:.4s cubic-bezier(.3,1.3,.5,1);z-index:60}
.toast.show{transform:none;opacity:1}
.scrim{display:none}

label input{font-weight:500}
.sech{font-size:13px;font-weight:800;color:var(--acc2);margin:22px 0 -4px;padding-top:14px;border-top:1px dashed var(--line)}
.cap{position:relative}.cap span{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-weight:800;color:var(--mut)}
.wchip{border:1px solid var(--line);background:none;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;transition:.2s}
.wchip.on{background:var(--c);border-color:var(--c);color:#fff}
.avs{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.av{border-left:3px solid var(--c);background:var(--bg);border-radius:0 10px 10px 0;padding:10px 14px;font-size:13.5px;animation:in .35s both}
.av small{color:var(--mut);font-weight:600}
.etr{border-radius:14px;padding:16px 18px;border:1px solid var(--line);background:var(--bg);margin-top:12px;transition:background .4s,border-color .4s}
.etr-t{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.07em}
.etr-d{display:flex;align-items:baseline;gap:4px;margin:8px 0 12px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.etr-d b{font-size:32px;font-weight:800;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px 10px}
.etr-d i{font-style:normal;color:var(--mut);font-weight:700;margin-right:8px}
.etr-bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.etr-bar span{display:block;height:100%;border-radius:99px;background-color:var(--c,var(--ok));transition:width 1s linear;background-image:linear-gradient(45deg,rgba(255,255,255,.3) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.3) 50%,rgba(255,255,255,.3) 75%,transparent 75%);background-size:22px 22px;animation:stripes 1s linear infinite}
@keyframes stripes{to{background-position:22px 0}}
.etr.ok{--c:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.etr.warn{--c:var(--warn);border-color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--bg))}
.etr.bad{--c:var(--bad);border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--bg));animation:pulse 1.2s ease-in-out infinite}
.etr.over .etr-d b{color:var(--bad)}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--bad) 22%,transparent)}}
.side{overflow-y:auto}
.tm{margin:10px 0;padding:14px;border-radius:14px;background:var(--side2);border:1px solid var(--stl)}
.tm-h{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--stx2)}
.tm-h em{font-style:normal;padding:2px 9px;border-radius:99px;background:var(--stl);color:var(--stx);letter-spacing:0;text-transform:none;font-weight:700}
.tm-id{color:var(--sts);font-weight:800;margin:6px 0 8px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-r{display:flex;flex-direction:column;padding:8px 10px;border-radius:10px;margin-top:6px;border-left:3px solid var(--c);background:var(--side);opacity:.6;transition:opacity .3s,background .3s}
.tm-r span{font-size:11.5px;color:var(--stx2);font-weight:600}
.tm-r b{font-size:19px;color:var(--sts);font-variant-numeric:tabular-nums}
.tm-r.run{opacity:1;box-shadow:0 3px 12px rgba(20,33,61,.1)}
.tm-r.run span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:6px;animation:dot 1.2s ease-in-out infinite}
@keyframes dot{50%{opacity:.2;transform:scale(.7)}}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.cal-b{border:1px solid var(--line);background:none;border-radius:9px;width:34px;height:34px;font-size:18px;color:var(--ink)}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-w span{font-size:11.5px;color:var(--mut);font-weight:700;padding:4px 0}
.cal-g button{border:0;background:none;border-radius:9px;height:36px;font-weight:600;font-size:13.5px;color:var(--ink);transition:background .15s,transform .15s}
.cal-g button:hover{background:var(--bg);transform:scale(1.08)}
.cal-g .sel{background:var(--acc);color:#fff}
.cal-g .today{outline:1px solid var(--acc)}
.hm{display:flex;align-items:center;gap:8px}
.hm input{width:70px;text-align:center;font-size:20px;font-weight:700}
.hm b{font-size:22px}
.ck{display:flex;align-items:center;gap:9px;cursor:pointer;margin:16px 0 6px;font-weight:700}
.ck input{width:18px;height:18px;padding:0;accent-color:var(--acc);cursor:pointer}
.tkh{display:flex;align-items:flex-start;gap:12px;margin-top:8px;flex-wrap:wrap}
.tkh b{background:var(--acc);color:#fff;border-radius:99px;padding:3px 12px;font-size:13px;white-space:nowrap}
.tkcs{display:flex;gap:6px;flex-wrap:wrap}
.tkc{font:600 12px ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 8px;animation:in .25s both}
.avb{display:flex;gap:8px;margin-top:8px}
.btn{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
body,.top,.card{transition:background-color .35s,color .35s,border-color .35s}
.item svg{transition:transform .25s}
.item:hover svg{transform:scale(1.15) rotate(-6deg)}
.logo{animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-3px)}}
.boot .brand,.boot .nav>*,.boot .tm,.boot .user{animation:slideIn .55s cubic-bezier(.3,.8,.3,1) both}
@keyframes slideIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.boot .tm{animation-delay:.32s}.boot .user{animation-delay:.4s}
.kpi{animation:in .5s cubic-bezier(.3,.8,.3,1) both;transition:transform .25s,box-shadow .25s,background-color .35s,border-color .35s}
.kpi:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(20,33,61,.13)}
tbody tr{animation:rowIn .45s cubic-bezier(.3,.8,.3,1) both}
@keyframes rowIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
tbody tr td:first-child{transition:box-shadow .2s}
tbody tr:hover td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
.top h1{animation:in .5s both}
.avb{display:flex;gap:6px;margin-top:8px}
.av.ed{outline:2px solid var(--acc)}
.boot .nav>*:nth-child(2){animation-delay:0.06s}
.kpi:nth-child(2){animation-delay:0.07s}
.boot .nav>*:nth-child(3){animation-delay:0.12s}
.kpi:nth-child(3){animation-delay:0.14s}
.boot .nav>*:nth-child(4){animation-delay:0.18s}
.kpi:nth-child(4){animation-delay:0.21s}
.boot .nav>*:nth-child(5){animation-delay:0.24s}
.kpi:nth-child(5){animation-delay:0.28s}
tbody tr:nth-child(2){animation-delay:0.04s}
tbody tr:nth-child(3){animation-delay:0.08s}
tbody tr:nth-child(4){animation-delay:0.12s}
tbody tr:nth-child(5){animation-delay:0.16s}
tbody tr:nth-child(6){animation-delay:0.20s}
tbody tr:nth-child(7){animation-delay:0.24s}
tbody tr:nth-child(8){animation-delay:0.28s}
tbody tr:nth-child(9){animation-delay:0.32s}
tbody tr:nth-child(10){animation-delay:0.36s}
.evtm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.evtm:empty{display:none}
.tmc{display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.tmc i{font-style:normal;font-size:11px;color:var(--mut);font-weight:700}
.tmc b{font-variant-numeric:tabular-nums}
@media (max-width:860px){
 .side{position:fixed;inset:0 auto 0 0;transform:translateX(-100%)}
 .side.show{transform:none}
 .scrim{display:block;position:fixed;inset:0;background:rgba(8,14,30,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
 .scrim.show{opacity:1;pointer-events:auto}
 .burger{display:block}
 .top{padding:14px 16px}.view{padding:18px 16px 40px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<aside class="side" id="side">
 <div class="brand"><div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></div>NetOps</div>
 <nav class="nav" id="nav"></nav>
 <div class="tm" id="tmw"><div class="tm-h"><span>Cronómetros</span><em id="tm-st">Sin ticket</em></div><div class="tm-id" id="tm-id">—</div>
 <div class="tm-r" id="tm-p" style="--c:#22c55e"><span>Tiempo progreso</span><b>00:00:00</b></div>
 <div class="tm-r" id="tm-s" style="--c:#f59e0b"><span>Tiempo suspendido</span><b>00:00:00</b></div>
 <div class="tm-r" id="tm-t" style="--c:#3b82f6"><span>Tiempo total transcurrido</span><b>00:00:00</b></div></div>
 <div class="user" id="user" style="cursor:pointer" title="Cambiar nombre"><div class="avatar" id="av">?</div><div><span id="uname"></span><small>Ingeniero N1</small></div></div>
</aside>
<div class="scrim" id="scrim"></div>

<section class="main">
 <header class="top">
  <button class="burger" id="burger" aria-label="Abrir menú"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div><h1 id="title"></h1><p id="subtitle"></p></div>
  <div class="sp"></div>
  <button class="btn ghost" id="sumBtn" style="display:none">Resumen de eventos</button><button class="btn" id="newBtn">+ Nuevo escalamiento</button>
</header>
 <main class="view" id="view"></main>
</section>

<div class="ov" id="ov"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script>
const ico={
 seg:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',
 esc:'<path d="M12 19V5M5 12l7-7 7 7"/>',
 cfg:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
 help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 115 0c0 1.5-2.5 2-2.5 3.5M12 17h.01"/>',
 ok:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
 doc:'<path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'};
const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ico[k]}</svg>`;
const TYPES={Corte:'#ef4444',N1:'#3b82f6',Eléctrico:'#f59e0b','Fibra Oscura':'#8b5cf6',OTN:'#10b5a4'};

const $=s=>document.querySelector(s);
let cur='seg',filter='Todos';

function buildNav(){persist();
 $('#nav').innerHTML=MENU.map(m=>m.sub?`
  <div class="grp ${cur.startsWith('esc')?'open':''}" id="g-esc">
   <button class="item ${cur.startsWith('esc')?'active':''}" data-toggle>${svg(m.icon)}${m.label}<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
   <div class="sub"><div>${m.sub.map(s=>{const n=LV().filter(t=>t.type===s&&t.st!=='Resuelto').length;return `<button class="item ${cur==='esc:'+s?'active':''}" data-go="esc:${s}" style="--c:${TYPES[s]}"><span class="dot"></span>${s}${n?`<span class="badge" style="background:${TYPES[s]}">${n}</span>`:''}</button>`}).join('')}</div></div>
  </div>`:`<button class="item ${cur===m.id?'active':''}" data-go="${m.id}">${svg(m.icon)}${m.label}</button>`).join('');
}
$('#nav').addEventListener('click',e=>{
 const t=e.target.closest('[data-toggle]');
 if(t){t.parentElement.classList.toggle('open');return}
 const g=e.target.closest('[data-go]');
 if(g){go(g.dataset.go);closeSide()}
});

function go(v){cur=v;filter='Todos';buildNav();render()}
function closeSide(){$('#side').classList.remove('show');$('#scrim').classList.remove('show')}
$('#burger').onclick=()=>{$('#side').classList.add('show');$('#scrim').classList.add('show')};
$('#scrim').onclick=closeSide;

function count(el,to){let n=0;const step=Math.max(1,Math.ceil(to/20));const i=setInterval(()=>{n=Math.min(to,n+step);el.textContent=n;if(n>=to)clearInterval(i)},30)}

function idCell(t){
 if(t.parent)return `<b>${t.id}</b><br><span class="tag" style="--c:#8b5cf6;margin-top:4px">Ticket hijo · ${esc(t.parent)}</span>`;
 const k=T.filter(x=>x.parent===t.id&&!x.del).map(x=>x.id);
 return `<b>${t.id}</b><br><span class="tag" style="--c:#0ea5e9;margin-top:4px">Ticket master</span>${k.length?`<br><small style="color:var(--mut);font-weight:600">Asociados: ${k.map(esc).join(', ')}</small>`:''}`;
}
function rows(list){
 if(!list.length)return `<div class="empty">No hay incidentes con este filtro.</div>`;
 return `<div class="scroll"><table><thead><tr><th>ID</th><th>Sitio o cliente</th><th>Tipo</th><th>Estado</th><th>Prioridad</th><th>Tiempo</th></tr></thead><tbody>${list.map(t=>`
 <tr data-id="${t.id}"><td>${idCell(t)}</td><td>${t.site}</td><td><span class="tag" style="--c:${TYPES[t.type]}">${t.type}</span></td><td><span class="tag" style="--c:${ST[t.st]}">${t.st}</span></td><td>${t.pr}</td><td>${t.time}</td></tr>`).join('')}</tbody></table></div>`;
}

function render(){
 const sb=$('#sumBtn');if(sb)sb.style.display=cur.startsWith('esc:')?'':'none';
 const v=$('#view');const isEsc=cur.startsWith('esc:');const type=isEsc?cur.slice(4):null;
 $('#newBtn').style.display=(cur==='cfg'||cur==='help'||cur==='res'||cur==='del'||cur==='evt')?'none':'';$('#newBtn').textContent=({'esc:Corte':'+ Escalar corte','esc:N1':'+ Escalar N1','esc:Eléctrico':'+ Escalar eléctrico'})[cur]||'+ Nuevo escalamiento';
 if(cur==='seg'){
  $('#title').textContent='Seguimiento';$('#subtitle').textContent='Estado en vivo de todos los incidentes';
  const open=LV().filter(t=>t.st!=='Resuelto');
  const k=[['Incidentes activos',open.length,'#3b82f6'],['Críticos',open.filter(t=>t.pr==='Crítica').length,'#ef4444'],['Escalados',LV().filter(t=>t.st==='Escalado').length,'#f59e0b'],['Resueltos hoy',LV().filter(t=>t.st==='Resuelto').length,'#22c55e']];
  const list=filter==='Todos'?open:open.filter(t=>t.type===filter);
  v.innerHTML=`<div class="kpis">${k.map(x=>`<div class="kpi" style="--c:${x[2]}"><span>${x[0]}</span><b data-n="${x[1]}">0</b></div>`).join('')}</div>
  <div class="card"><div class="card-h"><h2>Incidentes</h2><div class="chips">${['Todos',...Object.keys(TYPES)].map(c=>`<button class="chip ${c===filter?'on':''}" data-f="${c}">${c}</button>`).join('')}</div></div>${rows(list)}</div>`;
  v.querySelectorAll('[data-n]').forEach(el=>count(el,+el.dataset.n));
 }else if(isEsc){
  $('#title').textContent='Escalamiento · '+type;$('#subtitle').textContent='Incidentes de tipo '+type+' y su avance';
  const list=LV().filter(t=>t.type===type&&t.st!=='Resuelto');
  v.innerHTML=`<div class="card"><div class="card-h"><h2>${list.length} incidentes de ${type}</h2></div>${rows(list)}</div>`;
 }else if(cur==='evt'){evtView(v);
 }else if(cur==='del'){
  $('#title').textContent='Eliminados';$('#subtitle').textContent='Tickets eliminados: puedes restaurarlos';
  const dl=T.filter(t=>t.del);
  v.innerHTML=`<div class="card"><div class="card-h"><h2>${dl.length} eliminados</h2></div>${rows(dl)}</div>`;
 }else if(cur==='res'){
  $('#title').textContent='Resueltos';$('#subtitle').textContent='Incidentes ya cerrados';
  const done=LV().filter(t=>t.st==='Resuelto');const list=filter==='Todos'?done:done.filter(t=>t.type===filter);
  v.innerHTML=`<div class="card"><div class="card-h"><h2>${done.length} resueltos</h2><div class="chips">${['Todos',...Object.keys(TYPES)].map(c=>`<button class="chip ${c===filter?'on':''}" data-f="${c}">${c}</button>`).join('')}</div></div>${rows(list)}</div>`;
 }else if(cur==='cfg'){
  $('#title').textContent='Configuración';$('#subtitle').textContent='Ajusta cómo trabaja tu panel';
  const opts=[['Alertas sonoras','Suena un aviso cuando entra un incidente crítico',true],['Notificaciones por correo','Recibe un resumen al cerrar cada turno',false],['Actualización automática','Refresca los datos cada 30 segundos',true],['Modo oscuro','Cambia la apariencia del panel',document.documentElement.dataset.theme==='dark']];
  v.innerHTML=`<div class="card">${opts.map((o,i)=>`<div class="set"><div><b>${o[0]}</b><small>${o[1]}</small></div><button class="sw" role="switch" aria-checked="${o[2]}" data-sw="${i}" aria-label="${o[0]}"></button></div>`).join('')}</div>`;
 }else{
  $('#title').textContent='Ayuda';$('#subtitle').textContent='Respuestas rápidas a las dudas más comunes';
  v.innerHTML=`<div class="card"><details open><summary>¿Cómo creo un escalamiento?</summary><p>Pulsa "Nuevo escalamiento", elige el tipo, el sitio y describe la falla. El área responsable recibe el aviso al instante.</p></details><details><summary>¿Qué significa cada estado?</summary><p>Abierto: sin atender. En proceso: un técnico trabaja en él. Escalado: pasó a otra área. Resuelto: el servicio se restableció.</p></details><details><summary>¿Cómo veo el detalle de un incidente?</summary><p>Haz clic en cualquier fila de la tabla y se abrirá una ventana con toda la información.</p></details><details><summary>¿Con quién hablo si el panel falla?</summary><p>Escribe al equipo de soporte del NOC desde el botón de contacto de tu supervisor.</p></details></div>`;
 }
}

/* Delegated events on view */
$('#view').addEventListener('click',e=>{
 const f=e.target.closest('[data-f]');if(f){filter=f.dataset.f;render();return}
 const r=e.target.closest('tr[data-id]');if(r){detail(r.dataset.id);return}
 const s=e.target.closest('[data-sw]');
 if(s){const on=s.getAttribute('aria-checked')!=='true';s.setAttribute('aria-checked',on);
  if(s.dataset.sw==='3'){document.documentElement.dataset.theme=on?'dark':'light';try{localStorage.setItem('netops-theme',on?'dark':'light')}catch(e){}}
  toast(on?'Opción activada':'Opción desactivada')}
});

/* Modal */
function open(html,w){$('#modal').className='modal'+(w?' wide':'');$('#modal').oninput=$('#modal').onchange=null;$('#modal').innerHTML=html;$('#ov').classList.add('show')}
function close(){$('#ov').classList.remove('show')}
$('#ov').addEventListener('click',e=>{if((e.target.id==='ov'&&!$('#modal').classList.contains('wide'))||e.target.closest('[data-close]'))close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});

function detail(id){
 const t=T.find(x=>x.id===id),sg=t.seg||[],kids=T.filter(x=>x.parent===t.id&&!x.del);
 const B=(i,l,p,x)=>`<button class="btn${p?'':' ghost'}" id="${i}"${x?` style="${x}"`:''}>${l}</button>`;
 open(`<h3>${t.id}</h3><p class="sub2">${t.site}${t.del?' · <b style="color:var(--bad)">Eliminado</b>':''}</p>
 <dl class="dl"><dt>Tipo</dt><dd><span class="tag" style="--c:${TYPES[t.type]}">${t.type}</span></dd><dt>Estado</dt><dd><span class="tag" style="--c:${ST[t.st]}">${t.st}</span></dd><dt>Prioridad</dt><dd>${t.pr}</dd><dt>Abierto hace</dt><dd>${t.time}</dd><dt>Responsable</dt><dd>${t.who}</dd><dt>Descripción</dt><dd style="font-weight:500">${t.desc}</dd>${t.parent?`<dt>Ticket master</dt><dd><span class="tag" style="--c:#8b5cf6">Ticket hijo</span> <button class="chip" id="gm">${esc(t.parent)}</button></dd>`:''}${kids.length?`<dt>Tickets secundarios</dt><dd>${kids.map(k=>`<button class="chip" data-kid="${esc(k.id)}">${esc(k.id)}</button>`).join(' ')}</dd>`:''}${sg.length?`<dt>Seguimientos</dt><dd>${sg.map((x,k)=>`<button class="chip" data-cs="${k}">Copiar ${esc(x.num)}</button>`).join(' ')}</dd>`:''}</dl>
 <div class="row" style="flex-wrap:wrap"><button class="btn ghost" data-close>Cerrar</button>${B('vt','Ver plantilla')}${B('ct','Copiar plantilla')}${t.ev&&(t.d||t.el)?B('cev','Copiar plantilla de evento'):''}${t.del?B('rs','Restaurar',1)+B('hd','Eliminar definitivamente',0,'color:var(--bad)'):B('ed','Editar plantilla')+(t.parent?'':B('gev','Plantilla de evento'))+(t.parent?'':B('sg','Crear ticket secundario'))+B('dl','Eliminar',0,'color:var(--bad)')+(t.st!=='Resuelto'?B('resolve','Marcar resuelto',1):B('reopen','Reabrir',1))}</div>`);
 $('#vt').onclick=()=>{const o=$('#tv');if(o){o.remove();$('#vt').textContent='Ver plantilla';return}const el=document.createElement('pre');el.className='tpl';el.id='tv';el.style.cssText='position:static;margin-top:18px;max-height:42vh;overflow:auto';el.textContent=tplOf(t);$('#modal .row').before(el);$('#vt').textContent='Ocultar plantilla'};
 $('#ct').onclick=()=>copyText(tplOf(t),'Plantilla copiada');
 document.querySelectorAll('[data-kid]').forEach(b=>b.onclick=()=>detail(b.dataset.kid));const gev=$('#gev');if(gev)gev.onclick=()=>{close();EV=t.id;W=null;go('evt')};const cev=$('#cev');if(cev)cev.onclick=()=>copyText(tplEvento(t.ev),'Plantilla de evento copiada');const gm=$('#gm');if(gm)gm.onclick=()=>{if(T.find(x=>x.id===t.parent))detail(t.parent);else toast('No se encontró el ticket master')};
 document.querySelectorAll('[data-cs]').forEach(b=>b.onclick=()=>copyText(sg[b.dataset.cs].text,'Seguimiento copiado'));
 if(t.del){
  $('#rs').onclick=()=>{t.del=false;close();buildNav();render();toast(t.id+' restaurado')};
  let sure=false;$('#hd').onclick=e=>{if(!sure){sure=true;e.target.textContent='¿Seguro? Pulsa de nuevo';return}T.splice(T.indexOf(t),1);close();buildNav();render();toast('Eliminado definitivamente')};
  return;
 }
 $('#ed').onclick=()=>{close();if(t.parent){const m=T.find(x=>x.id===t.parent);if(m)segForm(m,t.id,t);else toast('No se encontró el ticket master')}else if(t.ev&&!t.d&&!t.el){EV=t.id;W=null;go('evt')}else if(t.type==='Eléctrico')electricForm(t);else corteForm(t)};
 const sgb=$('#sg');if(sgb)sgb.onclick=()=>ask({title:'Crear ticket secundario',sub:'Se asocia al ticket master '+t.id+'. Solo escribe el número del nuevo ticket.',label:'No. Ticket',ph:'Ej. 123456',ok:'Continuar',cancel:true,cb:n=>segForm(t,n)});
 $('#dl').onclick=()=>{t.del=true;t.delAt=Date.now();if(EV===t.id){EV=null;W=null}close();buildNav();render();toast(t.id+' enviado a Eliminados')};
 const r=$('#resolve');if(r)r.onclick=()=>{t.st='Resuelto';if(t.ev&&!t.ev.endAt){endTimers(t.ev);(t.ev.avs=t.ev.avs||[]).push({who:'Ticket resuelto',at:nowLocal(),txt:''})}if(WFor===t.id)W=null;close();buildNav();render();toast(t.id+' resuelto: ahora está en Resueltos')};
 const o=$('#reopen');if(o)o.onclick=()=>{t.st='Abierto';if(t.ev&&t.ev.endAt){t.ev.t0+=Date.now()-t.ev.endAt;t.ev.endAt=null}if(WFor===t.id)W=null;close();buildNav();render();toast(t.id+' reabierto')};
}

const LV=()=>T.filter(x=>!x.del);
const fdE=x=>{const t=new Date(x);if(!x||isNaN(t))return '';const p=n=>String(n).padStart(2,'0');return `${p(t.getDate())}/${p(t.getMonth()+1)}/${t.getFullYear()}, ${p(t.getHours())}:${p(t.getMinutes())}:${p(t.getSeconds())} GMT-5`};
const elOf=t=>t.el||{ticket:t.id,fecha:'',tipo:'UPS EN BATERIA',nodo:t.site,ups:'',upsx:[],rect:[],obs:t.desc||'',n1:ME,tc:t.who==='Por asignar'?'':(t.who||'')};
function tplElec(d){
 const pc=x=>(x===''||x==null?'':x)+'%';
 const nm=(a,l,f)=>a.map((x,i)=>`${l}${a.length>1?' '+(i+1):''}: ${f(x)}`);
 return ['*ESCALACIÓN TORRE DE CONTROL*',`Ticket: ${d.ticket}`,`Fecha: ${fdE(d.fecha)}`,`Tipo: ${d.tipo}`,`Nodo: ${d.nodo}`,`UPS principal: ${pc(d.ups)}`,...nm(d.upsx,'UPS adicional',pc),...nm(d.rect,'Rectificador',x=>x),'Observaciones:',d.obs,`Ingeniero N1: ${d.n1}`,`Ingeniero TC: @${d.tc}`].join('\n');
}
const ELBASE=['UPS EN BATERIA','REVISION DE NODO','REVISION DE EQUIPOS ELECTRICOS','ACOMPAÑAMIENTO','TEMPERATURA ALTA'];
let ELTIPOS=[];try{ELTIPOS=JSON.parse(localStorage.getItem('netops-eltipos')||'[]')}catch(e){}
const ELPRE=[['Generador','Nodo en batería, se solicita asistencia con GENERADOR URGENTE'],['Temperatura Alta','Se visualiza temperatura alta en el nodo, asistencia *URGENTE*'],['Revision Electrica','Movilizar personal para revisión de *EQUIPOS ELÉCTRICOS*'],['General-Default','UPS con alarma *GENERAL-DEFAULT*'],['Revision en nodo','Movilizar personal para la revision del nodo contactar con Electrico de Turno']];
function electricForm(et){
 const nowIso=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,19)};
 const dkey=et?'elec-edit-'+et.id:'elec',drf=DR.get(dkey);
 const E=JSON.parse(JSON.stringify(drf||(et?elOf(et):{ticket:'',fecha:'',tipo:'UPS EN BATERIA',nodo:'',ups:'',upsx:[],rect:[],obs:'',n1:ME,tc:''})));
 if(drf)toast('Borrador recuperado');
 if(!E.fecha)E.fecha=nowIso();if(!E.tipo)E.tipo='UPS EN BATERIA';
 const draw=()=>{
  const tipos=[...ELBASE,...ELTIPOS.filter(x=>!ELBASE.includes(x))];if(E.tipo&&!tipos.includes(E.tipo))tipos.push(E.tipo);
  const pct=(a,v)=>`<div class="cap"><input type="number" min="0" max="100" inputmode="numeric" ${a} value="${esc(v)}" style="padding-right:36px"><span>%</span></div>`;
  const rows=(ar,label,mk)=>E[ar].map((x,i)=>`<div class="fg2" style="grid-template-columns:1fr auto;align-items:end;margin-top:6px"><div><label>${label} ${i+1}${mk(`data-ar="${ar}" data-i="${i}"`,x)}</label></div><button type="button" class="chip" data-rm="${ar}:${i}" style="color:var(--bad);margin-bottom:4px">Quitar</button></div>`).join('');
  open(`<h3>${et?'Editar plantilla':'Escalación Torre de Control'} · Eléctrico</h3><p class="sub2">Completa los datos y copia la plantilla lista para enviar.</p>
  <div class="tg"><div id="elw">
  <div class="fg2"><div><label for="x-ticket">Ticket</label><input id="x-ticket" data-e="ticket" value="${esc(E.ticket)}"></div><div><label for="x-fecha">Fecha</label><input id="x-fecha" data-pk readonly style="cursor:pointer" value="${esc(fdE(E.fecha))}"></div></div>
  <label for="x-tipo">Tipo de reporte</label><select id="x-tipo">${tipos.map(o=>`<option value="${esc(o)}" ${o===E.tipo?'selected':''}>${esc(o)}</option>`).join('')}<option value="__otro">OTROS…</option></select>
  <label for="x-nodo">Nodo</label><input id="x-nodo" data-e="nodo" value="${esc(E.nodo)}">
  <div class="sec">UPS</div>
  <label>UPS principal</label>${pct('data-e="ups"',E.ups)}
  ${rows('upsx','UPS adicional',(a,x)=>pct(a,x))}
  <div style="margin-top:12px"><button type="button" class="btn ghost" data-add="upsx">+ Agregar UPS</button></div>
  <div class="sec">Rectificadores</div>
  ${rows('rect','Rectificador',(a,x)=>`<input ${a} value="${esc(x)}" placeholder="Ej. 80% / 54V">`)}
  <div style="margin-top:12px"><button type="button" class="btn ghost" data-add="rect">+ Agregar rectificador</button></div>
  <div class="sec">Observaciones</div>
  <div class="wchips" style="margin-top:10px">${ELPRE.map((p,i)=>`<button type="button" class="chip" data-pre="${i}">${p[0]}</button>`).join('')}</div>
  <label for="x-obs">Observaciones</label><textarea id="x-obs" data-e="obs">${esc(E.obs)}</textarea>
  <div class="fg2"><div><label for="x-n1">Ingeniero N1</label><input id="x-n1" data-e="n1" value="${esc(E.n1)}"></div><div><label for="x-tc">Ingeniero TC</label><input id="x-tc" data-e="tc" value="${esc(E.tc)}"></div></div>
  </div><div><pre class="tpl" id="tpl"></pre></div></div>
  <div class="row"><button class="btn ghost" data-close>Cancelar</button><button class="btn ghost" id="x-dis">Descartar borrador</button><button class="btn ghost" id="x-cp">Copiar plantilla</button><button class="btn" id="x-mk">${et?'Guardar cambios':'Crear y copiar'}</button></div>`,true);
  const upd=()=>{$('#tpl').textContent=tplElec(E);if(E.ticket||E.nodo||E.ups||E.upsx.length||E.rect.length||E.obs)DR.set(dkey,E);else DR.del(dkey)};upd();
  const tp=$('#x-tipo');
  tp.onchange=()=>{
   if(tp.value==='__otro'){tp.value=E.tipo;ask({title:'Otro tipo de reporte',sub:'Escribe el nombre de la revisión. Quedará guardado para próximos reportes.',label:'Nombre de la revisión',ph:'Ej. REVISION DE AIRE ACONDICIONADO',ok:'Agregar',cancel:true,cb:n=>{n=n.toUpperCase();if(!ELBASE.includes(n)&&!ELTIPOS.includes(n)){ELTIPOS.push(n);try{localStorage.setItem('netops-eltipos',JSON.stringify(ELTIPOS))}catch(x){}}E.tipo=n;draw()}});return}
   E.tipo=tp.value;upd();
  };
  const root=$('#elw');
  root.addEventListener('input',e=>{const el=e.target;if(el.dataset.e)E[el.dataset.e]=el.value;else if(el.dataset.ar)E[el.dataset.ar][+el.dataset.i]=el.value;upd()});
  root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.pk!==undefined){e.preventDefault();e.target.click()}});
  root.addEventListener('click',e=>{

function evParts(t){
 const ev=t.ev,d=t.d,el=t.el;
 const fecha=ev&&ev.acc?fdt(ev.acc):d&&d.fc?fdt(d.fc):el&&el.fecha?fdE(el.fecha).replace(' GMT-5',''):t.created?fdt(t.created):'';
 const tramo=(ev&&ev.tramo)||(d&&d.nodo)||(el&&el.nodo)||t.site||'';
 const tot=ev&&ev.t0?fdur((ev.endAt||Date.now())-ev.t0):'Sin iniciar';
 const kids=T.filter(x=>x.parent===t.id&&!x.del).map(x=>x.id);
 const diag=(ev&&ev.diag)||(d&&d.diag)||(el&&el.obs)||t.desc||'';
 const av=ev?avSorted(ev.avs||[]).filter(a=>a.who.startsWith('Avance')).pop():null;
 const ult=av?`[${fdt(av.at)}] ${av.who}${av.txt?': '+av.txt:''}`:'Sin avances';
 const tc=(ev&&ev.tc)||(d&&d.tc)||(el&&el.tc)||(t.who&&t.who!=='Por asignar'?t.who:'');
 return {fecha,tramo,tot,kids,diag,ult,tc,ev};
}

const evBloque=t=>{const p=evParts(t);return [`Ticket: ${t.id}`,`Tramo afectado: ${p.tramo}`,`Tickets secundarios: ${p.kids.length?p.kids.join(', '):'Ninguno'}`,`Último Avance: ${p.ult}`].join('\n')};

function resumenLista(types,inc){
 const L=[`${saludo()} estimados, se comparte el resumen de eventos hasta el momento,`,''];
 types.forEach((ty,i)=>{
  const ev=T.filter(t=>!t.del&&!t.parent&&t.type===ty&&(inc||t.st!=='Resuelto')),f=RES_FR[ty]||['Actualmente no se tiene eventos de '+ty+'.','los eventos de '+ty];
  if(!ev.length){L.push(`${i+1}. ${f[0]}`);return}

 });
 return L.join('\n').trim();
}

 if(!W||WFor!==EV){W=t?(t.ev?clone(t.ev):evFromTicket(t)):newW();WFor=EV}
 if(!W.avAt)W.avAt=nowLocal();
 const F=(k,l,ty)=>`<div><label for="e-${k}">${l}</label><input id="e-${k}" data-k="${k}" type="${ty||'text'}" value="${esc(W[k]||'')}"></div>`;
 const D=(k,l)=>`<div><label for="e-${k}">${l}</label><input id="e-${k}" data-dt="${k}" readonly placeholder="Seleccionar fecha y hora" value="${esc(fdt(W[k]))}" style="cursor:pointer"></div>`;
 const TK=(c,l)=>`<label class="ck"><input type="checkbox" data-k="${c}On" ${W[c+'On']?'checked':''}>${l}</label><div id="box-${c}" style="${W[c+'On']?'':'display:none'}"><textarea id="e-${c}Tk" data-k="${c}Tk" placeholder="Ej. TIK-20188018-J5S0 (separa varios con coma, espacio o salto de línea)" style="min-height:64px">${esc(W[c+'Tk'])}</textarea><div class="tkh"><b id="cnt-${c}"></b><div id="chips-${c}" class="tkcs"></div></div></div>`;
 const S=(k,l,o)=>`<div><label for="e-${k}">${l}</label><select id="e-${k}" data-k="${k}"><option value="">Seleccionar</option>${o.map(x=>`<option ${x===W[k]?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`;
 const WH=[['Avance por TCE','#3b82f6'],['Avance proveedor','#8b5cf6'],['Avance O&M','#10b5a4']];
 v.innerHTML=`<div class="card"><div class="card-h" style="gap:10px"><div style="display:flex;gap:10px;flex-wrap:wrap;flex:1"><button class="btn" id="ev-save">Guardar Ticket</button><button class="btn ghost" id="ev-new">Nuevo Ticket</button><button class="btn ghost" id="ev-del" style="color:var(--bad)">Eliminar Ticket</button><button class="btn ghost" id="ev-ok" style="color:var(--ok)">Marcar como resuelto</button>${t?'<button class="btn ghost" id="ev-av">Agregar avance ↓</button>':''}<button class="btn ghost" id="ev-sum">Resumen del evento</button></div>${t?`<span class="tag" style="--c:${TYPES[t.type]||'#3b82f6'}">${esc(t.type)}</span> <span class="tag" style="--c:${ST[t.st]}">${t.st}</span>`:'<span class="tag" style="--c:#6b7893">Sin guardar</span>'}</div></div>
 <div class="tg" style="margin-top:18px"><div class="card" id="evw" style="padding:6px 20px 24px">
 <label for="ev-open">Abrir ticket existente</label><select id="ev-open"><option value="">— Ticket nuevo —</option>${LV().filter(x=>!x.parent).map(x=>`<option value="${esc(x.id)}" ${x.id===EV?'selected':''}>${esc(x.type)} · ${esc(x.id)} · ${esc(x.site)}</option>`).join('')}</select>
 <div class="sech">Datos del evento</div>
 <div class="fg2">${F('id','ID Ticket')}${D('acc','Fecha y hora de afectación GMT-5')}</div>${W.acc&&!W.t0?'<small style="color:var(--warn);font-weight:600">Toca la fecha y confirma para iniciar los tiempos.</small>':''}
 <div class="sech">Suspensión y reanudación de tiempo</div>
 ${F('motivo','Motivo')}
 ${D('sfecha','Fecha y hora')}
 <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center"><button type="button" class="btn" id="e-susp" style="background:var(--warn);box-shadow:none">Registrar suspensión</button><button type="button" class="btn" id="e-res" style="background:var(--ok);box-shadow:none">Reanudar tiempos</button>${W.t0?`<span class="tag" style="--c:${W.endAt?'#6b7893':W.suspSince?'#f59e0b':'#22c55e'}">${W.endAt?'Resuelto':W.suspSince?'Tiempos suspendidos':'Tiempos corriendo'}</span>`:''}</div>
 <div class="sech">Tramo afectado</div>
 ${F('tramo','Tramo afectado')}
 ${W.eqs.map((q,i)=>`<div class="fg3" style="margin-top:6px"><div><label>Nodo<input data-ei="${i}" data-ef="n" value="${esc(q.n||'')}"></label></div><div><label>Hostname<input data-ei="${i}" data-ef="h" value="${esc(q.h)}"></label></div><div><label>Puerto<input data-ei="${i}" data-ef="p" value="${esc(q.p)}"></label></div>${i?`<button type="button" class="chip" data-rm="${i}" style="grid-column:1/-1;justify-self:end;margin-top:8px;color:var(--bad)">Quitar equipo ${i+1}</button>`:''}</div>`).join('')}
 <div style="margin-top:12px"><button type="button" class="btn ghost" id="e-add">+ Agregar equipo</button></div>
 <div class="sech">Red y proveedor</div>
 <div class="fg2">${S('red','Red afectada',REDES)}${S('onnet','Red Onnet',['Si','No'])}</div>
 <div class="fg2"><div><label for="e-prov">Proveedor Offline</label><select id="e-prov" data-k="prov">${['UFINET',...PROVS].map(x=>`<option value="${esc(x)}" ${x===W.prov?'selected':''}>${esc(x)}</option>`).join('')}<option value="__otro">Otros…</option></select></div>${F('pais','País de falla')}</div>
 <div class="sech">Impacto</div>
 <div class="fg2" style="grid-template-columns:2fr 1fr"><div><label for="e-impacto">Impacto</label><input id="e-impacto" data-k="impacto" value="${esc(W.impacto)}" placeholder="Describe el impacto"></div><div><label for="e-cap">Capacidad afectada</label><div class="cap"><input id="e-cap" data-k="cap" type="number" min="0" inputmode="numeric" value="${esc(W.cap)}" style="padding-right:36px"><span>G</span></div></div></div>
 ${TK('cd','Ticket caída total')}${TK('fo','Ticket fibra oscura')}
 <div class="sech">Diagnóstico</div>
 <label for="e-diag">Diagnóstico</label><textarea id="e-diag" data-k="diag">${esc(W.diag)}</textarea>
 <label for="e-acc2">Acciones adicionales</label><textarea id="e-acc2" data-k="acc2">${esc(W.acc2)}</textarea>
 <div class="sech">ETR</div>
 <label style="display:flex;align-items:center;gap:9px;cursor:pointer"><input type="checkbox" data-k="noetr" ${W.noetr?'checked':''} style="width:18px;height:18px;padding:0;accent-color:var(--acc)">Sin ETR (ocultar contador)</label>
 <div id="etr-sec" style="${W.noetr?'display:none':''}"><div class="fg3" style="align-items:end">${F('etrH','Horas','number')}${F('etrM','Minutos','number')}<div><button type="button" class="btn ghost" id="e-stop">Detener</button></div></div><div id="etr-box"></div></div>
 <div class="sech" id="sec-av">Avances y comentarios</div>
 <div class="wchips" style="margin-top:12px">${WH.map(([n,c])=>`<button type="button" class="wchip ${W.who===n?'on':''}" data-who="${n}" style="--c:${c}">${n}</button>`).join('')}</div>
 ${D('avAt','Fecha y hora del avance')}
 <label for="e-avTxt">Comentario</label><textarea id="e-avTxt" data-k="avTxt">${esc(W.avTxt)}</textarea>
 <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">${W.avEdit!=null?'<span class="tag" style="--c:#f59e0b">Editando avance</span>':''}<button type="button" class="btn" id="e-av">${W.avEdit!=null?'Guardar cambios':'Agregar avance'}</button>${W.avEdit!=null?'<button type="button" class="btn ghost" id="e-avc">Cancelar edición</button>':''}</div>
 <div class="avs">${avSorted(W.avs,1).filter(({a})=>!a.who.startsWith('Inicio de tiempos')).map(({a,i})=>`<div class="av" style="--c:${(WH.find(x=>x[0]===a.who)||[])[1]||(a.who.startsWith('Susp')?'#f59e0b':a.who.startsWith('Reanud')?'#22c55e':a.who.startsWith('Inicio')||a.who.startsWith('Afect')?'#3b82f6':'#6b7893')}"><small>${esc(a.who)} · ${fdt(a.at)}</small>${a.txt?'<br>'+esc(a.txt):''}${MANW.includes(a.who)?`<div class="avb"><button type="button" class="chip" data-ae="${i}">Editar</button><button type="button" class="chip" data-ad="${i}" style="color:var(--bad)">Eliminar</button></div>`:''}</div>`).join('')}</div>
 </div><div style="position:sticky;top:0"><pre class="tpl" id="tpl" data-ev style="position:static;max-height:68vh;overflow:auto"></pre><div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="e-copy">Copiar plantilla</button><button class="btn ghost" id="e-paste">Pegar plantilla</button></div></div></div>`;

 const upd=()=>{$('#tpl').textContent=tplEvento(W);saveWD()};upd();etrPaint();tkPaint('cd');tkPaint('fo');evTmPaint();
 const root=$('#evw');
 const onIn=e=>{
  const el=e.target;
  if(el.dataset.ei!==undefined){W.eqs[+el.dataset.ei][el.dataset.ef]=el.value;upd();return}
  const k=el.dataset.k;if(!k)return;
  if(k==='prov'){
   if(e.type!=='change')return;
   if(el.value==='__otro'){el.value=W.prov;ask({title:'Nuevo proveedor',sub:'Se guardará para futuros casos.',label:'Nombre del proveedor',ph:'Ej. Telconet',ok:'Agregar',cancel:true,cb:n=>{if(n.toUpperCase()!=='UFINET'&&!PROVS.includes(n)){PROVS.push(n);try{localStorage.setItem('netops-provs',JSON.stringify(PROVS))}catch(x){}}W.prov=n.toUpperCase()==='UFINET'?'UFINET':n;render()}});return}
  }
  W[k]=el.type==='checkbox'?el.checked:el.value;
  if(k==='cdOn'||k==='foOn'){$('#box-'+k.slice(0,2)).style.display=el.checked?'':'none'}
  if(k==='cdTk'||k==='foTk')tkPaint(k.slice(0,2));
  if(k==='etrH'||k==='etrM'){clearTimeout(etrT);etrT=setTimeout(etrAuto,700)}
  if(k==='noetr'){$('#etr-sec').style.display=el.checked?'none':'';if(el.checked){W.etr=null;etrPaint()}}
  upd();
 };
 root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.dt){e.preventDefault();openDT(e.target.dataset.dt)}});
 const openDT=k=>{
  if(k==='acc')pickDT({title:'Fecha y hora de afectación (GMT-5)',value:W.acc,cb:v=>{const first=!W.t0;W.acc=v;W.t0=Date.parse(v);if(!first)W.avs.push({who:'Afectación modificada',at:v,txt:''});if((W.id||'').trim()){saveEv();toast('Tiempos iniciados desde la afectación')}else toast('Tiempos iniciados. Escribe el ID Ticket para guardarlos');render();tmPaint()}});
  else pickDT({title:k==='avAt'?'Fecha y hora del avance':'Fecha y hora de suspensión o reanudación',value:W[k],cb:v=>{W[k]=v;render()}});
 };
 root.addEventListener('input',onIn);root.addEventListener('change',onIn);
 root.addEventListener('click',e=>{
  const dt=e.target.closest('[data-dt]');if(dt){openDT(dt.dataset.dt);return}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.rm){W.eqs.splice(+b.dataset.rm,1);render()}
  if(b.dataset.who){W.who=b.dataset.who;root.querySelectorAll('.wchip').forEach(x=>x.classList.toggle('on',x===b))}
  if(b.dataset.ae!==undefined){const a=W.avs[+b.dataset.ae];W.avEdit=+b.dataset.ae;W.who=a.who;W.avAt=a.at;W.avTxt=a.txt;render();const ta=$('#e-avTxt');if(ta){ta.scrollIntoView({block:'center'});ta.focus()}}
  if(b.dataset.ad!==undefined){const i=+b.dataset.ad,a=W.avs[i];open(`<h3>Eliminar avance</h3><p class="sub2">${esc(a.who)} · ${fdt(a.at)}${a.txt?'<br>'+esc(a.txt):''}</p><div class="row"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="avdel" style="background:var(--bad);box-shadow:none">Eliminar</button></div>`);$('#avdel').onclick=()=>{W.avs.splice(i,1);if(W.avEdit===i)W.avEdit=null;else if(W.avEdit>i)W.avEdit--;if((W.id||'').trim())saveEv();close();render();toast('Avance eliminado')}}
 });
 $('#e-susp').onclick=()=>{
  if(W.endAt){toast('El ticket ya está resuelto');return}
  if(!W.t0){toast('Primero confirma la fecha y hora de afectación');return}
  if(W.suspSince){toast('Los tiempos ya están suspendidos');return}
  if(!(W.id||'').trim()){const e=$('#e-id');e.style.borderColor='var(--bad)';e.focus();toast('Escribe el ID Ticket');return}
  const mo=(W.motivo||'').trim();if(!mo){const m=$('#e-motivo');m.style.borderColor='var(--bad)';m.focus();toast('Escribe el motivo de la suspensión');return}
  const at=W.sfecha?Date.parse(W.sfecha):Date.now();
  if(at<W.t0){toast('La suspensión no puede ser antes de la afectación');return}
  W.suspSince=at;W.avs.push({who:'Suspensión de tiempos',at:W.sfecha||nowLocal(),txt:mo});W.sfecha='';W.motivo='';
  if(saveEv()){render();toast('Tiempos suspendidos y registrados en la plantilla')}
 };
 $('#e-res').onclick=()=>{
  if(W.endAt){toast('El ticket ya está resuelto');return}
  if(!W.suspSince){toast('Los tiempos no están suspendidos');return}
  const at=W.sfecha?Date.parse(W.sfecha):Date.now();
  if(at<W.suspSince){toast('La reanudación no puede ser antes de la suspensión');return}
  W.suspAcc=(W.suspAcc||0)+at-W.suspSince;W.suspSince=null;W.avs.push({who:'Reanudación de tiempos',at:W.sfecha||nowLocal(),txt:''});W.sfecha='';
  if(saveEv()){render();toast('Tiempos reanudados y registrados en la plantilla')}
 };
 $('#e-add').onclick=()=>{W.eqs.push({n:'',h:'',p:''});render()};
 $('#e-stop').onclick=()=>{W.etr=null;W.etrH='';W.etrM='';if(W.id.trim())saveEv();render();toast('Contador detenido')};
 $('#e-av').onclick=()=>{
  const txt=(W.avTxt||'').trim();if(!txt){$('#e-avTxt').style.borderColor='var(--bad)';toast('Escribe el comentario del avance');return}
  const ed=W.avEdit!=null?W.avs[W.avEdit]:null,prev=ed?{...ed}:null,was=W.avEdit;
  if(ed){ed.who=W.who;ed.at=W.avAt||ed.at;ed.txt=txt}else W.avs.push({who:W.who,at:W.avAt||nowLocal(),txt});
  W.avEdit=null;
  if(!saveEv()){if(ed)Object.assign(ed,prev);else W.avs.pop();W.avEdit=was;return}
  W.avTxt='';W.avAt='';(T.find(x=>x.id===EV)).ev=clone(W);persist();render();toast(ed?'Avance actualizado':'Avance agregado y plantilla actualizada');
 };
 const avc=$('#e-avc');if(avc)avc.onclick=()=>{W.avEdit=null;W.avTxt='';W.avAt='';render()};
 $('#e-copy').onclick=()=>copyText(tplEvento(W),'Plantilla copiada');
 $('#e-paste').onclick=async()=>{let t='';try{t=await navigator.clipboard.readText()}catch(e){}if(t&&/ID Ticket:/.test(t)){pasteFill(t);return}pasteModal(t)};
 $('#ev-open').onchange=e=>{EV=e.target.value||null;W=null;render()};
 $('#ev-new').onclick=()=>{EV=null;W=null;render();toast('Formulario nuevo')};
 const ea=$('#ev-av');if(ea)ea.onclick=()=>{const x=$('#sec-av');if(x)x.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>{const t=$('#e-avTxt');if(t)t.focus()},500)};
 $('#ev-sum').onclick=()=>{
  if(!(W.id||'').trim()){const e=$('#e-id');e.style.borderColor='var(--bad)';e.focus();toast('Escribe el ID Ticket');return}
  const base=T.find(x=>x.id===W.id.trim())||{},txt=resumenEvento({...base,id:W.id.trim(),ev:W});
  open(`<h3>Resumen del evento</h3><p class="sub2">${esc(W.id)}</p><pre class="tpl" id="rs-pre" style="position:static;max-height:52vh;overflow:auto"></pre><div class="row"><button class="btn ghost" data-close>Cerrar</button><button class="btn" id="rs-cp">Copiar resumen</button></div>`);
  $('#rs-pre').textContent=txt;$('#rs-cp').onclick=()=>copyText(txt,'Resumen copiado');
 };
 $('#ev-save').onclick=()=>{if(saveEv()){render();toast('Ticket '+EV+' guardado')}};
 $('#ev-ok').onclick=()=>{
  const was=W.etr;W.etr=null;
  if(!saveEv()){W.etr=was;return}
  const x=T.find(y=>y.id===EV);x.st='Resuelto';endTimers(x.ev);x.ev.avs.push({who:'Ticket resuelto',at:nowLocal(),txt:''});W=null;buildNav();render();toast(x.id+' resuelto: ahora está en Resueltos');
 };
 $('#ev-del').onclick=()=>{
  if(!t){toast('Selecciona un ticket para eliminar');return}
  open(`<h3>Eliminar ticket</h3><p class="sub2">¿Seguro que quieres eliminar ${esc(t.id)}? Podrás restaurarlo desde Eliminados.</p><div class="row"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="dl" style="background:var(--bad);box-shadow:none">Eliminar</button></div>`);
  $('#dl').onclick=()=>{t.del=true;t.delAt=Date.now();EV=null;W=null;close();buildNav();render();toast('Ticket enviado a Eliminados')};
 };
}

let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2600)}

try{const x=JSON.parse(localStorage.getItem('netops-T')||'null');if(Array.isArray(x))T=x;EV=localStorage.getItem('netops-EV')||null;const wd=localStorage.getItem('netops-WD');if(wd&&!EV){W=JSON.parse(wd);WFor=EV}}catch(e){}
try{document.documentElement.dataset.theme=localStorage.getItem('netops-theme')==='dark'?'dark':'light'}catch(e){document.documentElement.dataset.theme='light'}
document.body.classList.add('boot');setTimeout(()=>document.body.classList.remove('boot'),1500);
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn');if(!b)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*1.6,x=document.createElement('span');x.className='rip';x.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(x);setTimeout(()=>x.remove(),650)});
$('#sumBtn').onclick=()=>resumenModal(cur.startsWith('esc:')?cur.slice(4):'all');
buildNav();render();initMe();tmPaint();setInterval(()=>{etrPaint();tmPaint();evTmPaint();tplLive()},1000);
</script>
</body>
</html>
